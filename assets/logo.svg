<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <!-- Fondo Suave Opcional / Contenedor Geométrico -->
  <rect width="240" height="240" rx="48" fill="#ffffff"/>
  
  <!-- Órbita Satelital Externa (NASA Radar Sweep / SMAP) -->
  <circle cx="120" cy="120" r="88" stroke="#18181b" stroke-width="3" stroke-dasharray="10 6" opacity="0.85"/>
  
  <!-- Terrazas Agrícolas Andinas Concéntricas (Laboratorio de Moray) -->
  <circle cx="120" cy="120" r="64" stroke="#71717a" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.6"/>
  <circle cx="120" cy="120" r="42" stroke="#27272a" stroke-width="2.5"/>
  
  <!-- Cuerda Principal del Quipu (Eje Vertical de Transmisión de Datos) -->
  <line x1="120" y1="22" x2="120" y2="218" stroke="#09090b" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Ondas Horizontales de Calibración Edáfica (Terreno) -->
  <path d="M 96 120 Q 120 110 144 120" stroke="#71717a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 88 165 Q 120 155 152 165" stroke="#71717a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  
  <!-- Nudo 1 (Campaña 1): Regeneración con Leguminosa (Tarwi / Nitrógeno) -->
  <circle cx="120" cy="62" r="11" fill="#10b981" stroke="#09090b" stroke-width="3.5"/>
  <circle cx="120" cy="62" r="4" fill="#ffffff"/>
  
  <!-- Nudo 2 (Campaña 2): Resiliencia Hídrica y Grano Andino (Quinua Pasankalla) -->
  <circle cx="120" cy="120" r="13" fill="#f59e0b" stroke="#09090b" stroke-width="4"/>
  <circle cx="120" cy="120" r="5" fill="#ffffff"/>
  
  <!-- Nudo 3 (Campaña 3): Cosecha y Seguridad Alimentaria (Papa Nativa Andina) -->
  <circle cx="120" cy="178" r="11" fill="#18181b" stroke="#09090b" stroke-width="3.5"/>
  <circle cx="120" cy="178" r="4" fill="#ffffff"/>
</svg>

